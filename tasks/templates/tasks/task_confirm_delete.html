{% extends 'tasks/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4 text-center">
                <div class="text-danger mb-3 fs-1">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h4 class="fw-bold mb-2">Delete Task?</h4>
                <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ task.title }}"</strong>? This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'task_list' %}" class="btn btn-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4"><i class="fa-solid fa-trash-can me-1"></i>Delete Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
