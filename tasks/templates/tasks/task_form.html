{% extends 'tasks/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="fw-bold mb-0"><i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Edit Task</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium">Task Title <span class="text-danger">*</span></label>
                        {{ form.title }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Description</label>
                        {{ form.description }}
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-medium">Category</label>
                            {{ form.category }}
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-medium">Priority</label>
                            {{ form.priority }}
                        </div>
                    </div>
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label class="form-label fw-medium">Status</label>
                            {{ form.status }}
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-medium">Due Date</label>
                            {{ form.due_date }}
                        </div>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'task_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom px-4"><i class="fa-solid fa-check me-1"></i>Update Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
