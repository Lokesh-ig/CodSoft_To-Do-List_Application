{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow | Smart To-Do Manager{% endblock %}</title>
    <!-- Favicon Icon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <link rel="shortcut icon" href="{% static 'images/favicon.svg' %}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .navbar-brand-logo {
            height: 46px;
            transition: transform 0.2s ease;
        }

        .navbar-brand-logo:hover {
            transform: scale(1.03);
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.25s ease-in-out;
        }

        .task-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            border-color: #cbd5e1;
        }

        .task-completed {
            background: #f1f5f9;
            opacity: 0.75;
        }

        .task-completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .badge-priority-High { background-color: #fee2e2; color: #991b1b; }
        .badge-priority-Medium { background-color: #fef3c7; color: #92400e; }
        .badge-priority-Low { background-color: #e0e7ff; color: #3730a3; }

        .badge-status-Pending { background-color: #f1f5f9; color: #475569; }
        .badge-status-In\ Progress { background-color: #e0f2fe; color: #075985; }
        .badge-status-Completed { background-color: #dcfce7; color: #166534; }

        .stat-box {
            border-radius: 12px;
            padding: 1.25rem;
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }

        .btn-primary-custom {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
        }

        .btn-nav-add {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-nav-add:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'task_list' %}">
                <img src="{% static 'images/logo.svg' %}" alt="TaskFlow Logo" class="navbar-brand-logo">
            </a>
            <button class="btn btn-nav-add px-4 py-2 rounded-3 d-flex align-items-center gap-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                <i class="fa-solid fa-plus"></i>
                <span>Add New Task</span>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container pb-5">
        {% if messages %}
            <div class="row">
                <div class="col-12">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-muted border-top mt-auto bg-white">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 <strong>TaskFlow</strong>. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
