    <!-- Instant Theme Loader (Prevents Flicker) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('taskflow-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        [data-bs-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
        }

        .navbar-brand-logo {
            height: 46px;
            transition: transform 0.2s ease;
        }

        .navbar-brand-logo:hover {
            transform: scale(1.03);
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 30px rgba(79, 70, 229, 0.15);
            border-color: #6366f1 !important;
        }

        [data-bs-theme="dark"] .task-card:hover {
            box-shadow: 0 14px 30px rgba(99, 102, 241, 0.25);
            border-color: #818cf8 !important;
        }

        .task-completed {
            background: #f1f5f9;
            opacity: 0.75;
        }

        [data-bs-theme="dark"] .task-completed {
            background: #1a2332 !important;
            opacity: 0.75;
        }

        .task-completed .task-title {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .badge-priority-High { background-color: #fee2e2; color: #991b1b; }
        .badge-priority-Medium { background-color: #fef3c7; color: #92400e; }
        .badge-priority-Low { background-color: #e0e7ff; color: #3730a3; }

        .badge-status-Pending { background-color: #f1f5f9; color: #475569; }
        .badge-status-In\ Progress { background-color: #e0f2fe; color: #075985; }
        .badge-status-Completed { background-color: #dcfce7; color: #166534; }

        .stat-box {
            border-radius: 12px;
            padding: 1.25rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .stat-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.15);
            border-color: #6366f1 !important;
        }

        .stat-box .rounded-circle {
            transition: transform 0.25s ease;
        }

        .stat-box:hover .rounded-circle {
            transform: scale(1.1);
        }

        [data-bs-theme="dark"] .stat-box:hover {
            box-shadow: 0 12px 25px rgba(99, 102, 241, 0.25);
            border-color: #818cf8 !important;
        }

        .btn-primary-custom {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
        }

        .btn-primary-custom:active {
            transform: translateY(0);
        }

        .btn-nav-add {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 600;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-nav-add:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            box-shadow: 0 8px 22px rgba(99, 102, 241, 0.45);
            transform: translateY(-2px);
        }

        .btn-nav-add:active {
            transform: translateY(0);
        }

        /* Theme Toggle Button */
        .btn-theme-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .btn-theme-toggle:hover {
            background: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            transform: rotate(15deg) scale(1.05);
        }

        /* Dark mode overrides for cards, forms, and modals */
        [data-bs-theme="dark"] .card,
        [data-bs-theme="dark"] .stat-box {
            background-color: var(--card-bg) !important;
            border-color: var(--border-color) !important;
            color: var(--text-dark) !important;
        }

        [data-bs-theme="dark"] .stat-box .text-dark {
            color: #f8fafc !important;
        }

        [data-bs-theme="dark"] .modal-content {
            background-color: var(--card-bg);
            color: var(--text-dark);
            border-color: var(--border-color);
        }

        [data-bs-theme="dark"] .modal-header,
        [data-bs-theme="dark"] .modal-footer {
            background-color: #0f172a !important;
            border-color: var(--border-color) !important;
        }

        [data-bs-theme="dark"] .form-control,
        [data-bs-theme="dark"] .form-select,
        [data-bs-theme="dark"] .input-group-text {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: var(--border-color) !important;
        }

        [data-bs-theme="dark"] footer {
            background-color: var(--card-bg) !important;
            border-color: var(--border-color) !important;
            color: var(--text-muted) !important;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'task_list' %}" title="TaskFlow Home">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" style="height: 44px; width: auto;" class="navbar-brand-logo">
                  <defs>
                    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#4f46e5" />
                      <stop offset="100%" stop-color="#3730a3" />
                    </linearGradient>
                    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#34d399" />
                      <stop offset="100%" stop-color="#059669" />
                    </linearGradient>
                    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stop-color="#818cf8" />
                      <stop offset="100%" stop-color="#38bdf8" />
                    </linearGradient>
                    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4f46e5" flood-opacity="0.4" />
                    </filter>
                  </defs>
                  <g transform="translate(10, 10)">
                    <rect x="0" y="5" width="90" height="95" rx="18" fill="url(#bgGrad)" filter="url(#shadow)"/>
                    <rect x="30" y="0" width="30" height="12" rx="4" fill="#818cf8" />
                    <rect x="36" y="3" width="18" height="6" rx="2" fill="#ffffff" />
                    <circle cx="24" cy="32" r="8" fill="url(#checkGrad)" />
                    <path d="M20 32 L23 35 L28 29" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    <rect x="38" y="29" width="36" height="6" rx="3" fill="#ffffff" opacity="0.9" />
                    <circle cx="24" cy="53" r="8" fill="url(#checkGrad)" />
                    <path d="M20 53 L23 56 L28 50" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    <rect x="38" y="50" width="30" height="6" rx="3" fill="#ffffff" opacity="0.9" />
                    <circle cx="24" cy="74" r="8" fill="#6366f1" />
                    <circle cx="24" cy="74" r="4" fill="#ffffff" />
                    <rect x="38" y="71" width="22" height="6" rx="3" fill="#c7d2fe" opacity="0.8" />
                  </g>
                  <text x="120" y="72" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="48" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
                    Task<tspan fill="url(#textGrad)">Flow</tspan>
                  </text>
                </svg>
            </a>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-nav-add px-4 py-2 rounded-3 d-flex align-items-center gap-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#addTaskModal">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add New Task</span>
                </button>
                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" class="btn btn-theme-toggle shadow-sm" type="button" title="Toggle Light/Dark Theme">
                    <i id="themeIcon" class="fa-solid fa-moon fs-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container pb-5">
        {% if messages %}
            <div class="row">
                <div class="col-12">
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-muted border-top mt-auto bg-white">
        <div class="container">
            <p class="mb-0 small">&copy; 2026 <strong>TaskFlow</strong>. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Persistent Light/Dark Theme Switcher Script -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');

        function updateThemeUI(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            if (theme === 'dark') {
                themeIcon.className = 'fa-solid fa-sun fs-5 text-warning';
                themeToggleBtn.setAttribute('title', 'Switch to Light Theme');
            } else {
                themeIcon.className = 'fa-solid fa-moon fs-5';
                themeToggleBtn.setAttribute('title', 'Switch to Dark Theme');
            }
        }

        const currentTheme = localStorage.getItem('taskflow-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        updateThemeUI(currentTheme);

        themeToggleBtn.addEventListener('click', () => {
            const activeTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = activeTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('taskflow-theme', newTheme);
            updateThemeUI(newTheme);
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
